<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.65"/>
    </linearGradient>

    <linearGradient id="layerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <linearGradient id="layerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>

    <linearGradient id="layerGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <!-- Shadow Filters -->
    <filter id="cardShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)"/>
  <rect width="900" height="520" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Ambient Glow Blobs in Background (Simulating background content) -->
  <circle cx="280" cy="190" r="110" fill="#3b82f6" opacity="0.25" filter="url(#glowFilter)"/>
  <circle cx="420" cy="270" r="90" fill="#8b5cf6" opacity="0.2" filter="url(#glowFilter)"/>
  <circle cx="160" cy="350" r="80" fill="#10b981" opacity="0.15" filter="url(#glowFilter)"/>

  <!-- Diagram Header -->
  <g transform="translate(40, 42)">
    <rect x="0" y="0" width="130" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1"/>
    <text x="65" y="16" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">CSS ARCHITECTURE</text>
    <text x="0" y="52" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">How Glassmorphism Actually Works in Our Build</text>
    <text x="0" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Deconstructing the 4-layer GPU rendering stack of <tspan fill="#38bdf8" font-family="'JetBrains Mono', monospace">docs/style.css (.glass-panel)</tspan></text>
  </g>

  <!-- Left Side: Visual 3D Stack Representation -->
  <g transform="translate(60, 145)">
    <!-- Layer 1: Ambient Background -->
    <g transform="translate(0, 190)">
      <polygon points="40,30 320,30 280,85 0,85" fill="#0f172a" stroke="#334155" stroke-width="1.5" opacity="0.9"/>
      <circle cx="140" cy="55" r="22" fill="#3b82f6" opacity="0.6"/>
      <circle cx="190" cy="60" r="18" fill="#8b5cf6" opacity="0.6"/>
      <text x="140" y="78" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Layer 1: Background Canvas</text>
    </g>

    <!-- Layer 2: Backdrop Filter Blur -->
    <g transform="translate(0, 125)">
      <polygon points="40,30 320,30 280,85 0,85" fill="#3b82f6" fill-opacity="0.12" stroke="#3b82f6" stroke-dasharray="4,3" stroke-width="1.5"/>
      <text x="140" y="62" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Layer 2: backdrop-filter: blur(12px)</text>
    </g>

    <!-- Layer 3: Semi-Transparent Tint -->
    <g transform="translate(0, 60)">
      <polygon points="40,30 320,30 280,85 0,85" fill="#111827" fill-opacity="0.75" stroke="#8b5cf6" stroke-width="1.5"/>
      <text x="140" y="62" fill="#c084fc" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">Layer 3: background: rgba(17,24,39, 0.75)</text>
    </g>

    <!-- Layer 4: Border Bevel & Crisp Text -->
    <g transform="translate(0, -5)">
      <polygon points="40,30 320,30 280,85 0,85" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
      <text x="140" y="52" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" text-anchor="middle">⚡ Crisp Text (100% Sharp)</text>
      <text x="140" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10" text-anchor="middle">Layer 4: border: 1px solid rgba(255,255,255,0.1)</text>
    </g>
  </g>

  <!-- Right Side: The Breakdown Cards -->
  <g transform="translate(420, 135)">
    <!-- Card 1: backdrop-filter vs filter -->
    <rect x="0" y="0" width="440" height="105" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="0" y="0" width="4" height="105" rx="2" fill="url(#layerGrad1)"/>
    <text x="20" y="24" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">1. backdrop-filter: blur(12px) [The Behind-the-Glass Effect]</text>
    <text x="20" y="46" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Standard <tspan fill="#f43f5e" font-family="'JetBrains Mono', monospace">filter: blur()</tspan> blurs the card <tspan font-style="italic">and</tspan> all its text inside.</text>
    <text x="20" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12"><tspan fill="#38bdf8" font-family="'JetBrains Mono', monospace">backdrop-filter</tspan> tells the GPU: <tspan fill="#60a5fa" font-weight="600">"Only blur what's BEHIND this window,</tspan></text>
    <text x="20" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">leaving my text, badges, and buttons 100% razor sharp."</text>

    <!-- Card 2: Alpha Channel Translucency -->
    <g transform="translate(0, 118)">
      <rect x="0" y="0" width="440" height="105" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="4" height="105" rx="2" fill="url(#layerGrad2)"/>
      <text x="20" y="24" fill="#a78bfa" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">2. background: rgba(17, 24, 39, 0.75) [Sunglasses Tint]</text>
      <text x="20" y="46" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">If opacity is 1.0 (100% solid), no light passes through and blur is invisible.</text>
      <text x="20" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">The <tspan fill="#c084fc" font-family="'JetBrains Mono', monospace">0.75 alpha</tspan> lets 25% of background shape bleed through</text>
      <text x="20" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">while providing enough dark contrast for white text to pass WCAG AAA.</text>
    </g>

    <!-- Card 3: Light-Catching Edge -->
    <g transform="translate(0, 236)">
      <rect x="0" y="0" width="440" height="105" rx="10" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
      <rect x="0" y="0" width="4" height="105" rx="2" fill="url(#layerGrad3)"/>
      <text x="20" y="24" fill="#34d399" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">3. border: 1px solid rgba(255, 255, 255, 0.1) [The Glass Bevel]</text>
      <text x="20" y="46" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">Real glass has thickness. The edges catch ambient light reflection.</text>
      <text x="20" y="66" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="12">A subtle 10% white line defines the boundary against dark backgrounds,</text>
      <text x="20" y="86" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="12">giving the user's eye instant tactile depth and 3D elevation.</text>
    </g>
  </g>

  <!-- Bottom Footer Bar -->
  <g transform="translate(40, 485)">
    <text x="0" y="12" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">FlyRank AI Internship · Week 6 · Explain It Like You Built It · M. B. Qayyum</text>
    <text x="820" y="12" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">✓ 100% OWNED CODE</text>
  </g>
</svg>
