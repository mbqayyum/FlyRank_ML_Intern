<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bg-grad)" rx="16" />

  <!-- Header -->
  <text x="500" y="45" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">
    FlyRank Refresh Scout — Raw Run Execution Loop (2.55s)
  </text>
  <text x="500" y="70" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">
    Autonomous Control Loop: Input Request ──► DuckDB SQL ──► Scikit-Learn RF Model ──► Reason Code ──► SERP Context ──► Ticket Output
  </text>

  <!-- Timeline Line -->
  <line x1="100" y1="330" x2="900" y2="330" stroke="#475569" stroke-width="4" stroke-dasharray="6 6" />

  <!-- STEP 1: TRIGGER & QUERY -->
  <g transform="translate(80, 120)">
    <rect width="160" height="180" fill="url(#card-grad)" stroke="#3b82f6" stroke-width="2" rx="12" filter="url(#glow)" />
    <circle cx="80" cy="30" r="18" fill="#3b82f6" />
    <text x="80" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
    <text x="80" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SQL Query</text>
    <text x="80" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">`DuckDB` Engine</text>
    <rect x="15" y="115" width="130" height="45" fill="#0f172a" rx="6" />
    <text x="80" y="133" font-family="monospace" font-size="10" fill="#60a5fa" text-anchor="middle">30,000 Rows</text>
    <text x="80" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Time: 0.347s</text>
  </g>

  <!-- STEP 2: ML SCORING -->
  <g transform="translate(260, 120)">
    <rect width="160" height="180" fill="url(#card-grad)" stroke="#8b5cf6" stroke-width="2" rx="12" filter="url(#glow)" />
    <circle cx="80" cy="30" r="18" fill="#8b5cf6" />
    <text x="80" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
    <text x="80" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ML Scoring</text>
    <text x="80" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">`Scikit-Learn RF`</text>
    <rect x="15" y="115" width="130" height="45" fill="#0f172a" rx="6" />
    <text x="80" y="133" font-family="monospace" font-size="10" fill="#a78bfa" text-anchor="middle">`rf_prob` Scored</text>
    <text x="80" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Time: 0.863s</text>
  </g>

  <!-- STEP 3: REASON CODE -->
  <g transform="translate(440, 120)">
    <rect width="160" height="180" fill="url(#card-grad)" stroke="#ec4899" stroke-width="2" rx="12" filter="url(#glow)" />
    <circle cx="80" cy="30" r="18" fill="#ec4899" />
    <text x="80" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>
    <text x="80" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Reason Codes</text>
    <text x="80" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Rules Ladder Engine</text>
    <rect x="15" y="115" width="130" height="45" fill="#0f172a" rx="6" />
    <text x="80" y="133" font-family="monospace" font-size="10" fill="#f472b6" text-anchor="middle">`low_ctr`/`freshness`</text>
    <text x="80" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Time: 0.580s</text>
  </g>

  <!-- STEP 4: SERP CONTEXT -->
  <g transform="translate(620, 120)">
    <rect width="160" height="180" fill="url(#card-grad)" stroke="#10b981" stroke-width="2" rx="12" filter="url(#glow)" />
    <circle cx="80" cy="30" r="18" fill="#10b981" />
    <text x="80" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>
    <text x="80" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SERP Context</text>
    <text x="80" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Web Fetch / SERP API</text>
    <rect x="15" y="115" width="130" height="45" fill="#0f172a" rx="6" />
    <text x="80" y="133" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">AI Overview Flag</text>
    <text x="80" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Time: 0.300s</text>
  </g>

  <!-- STEP 5: TICKET GENERATION -->
  <g transform="translate(800, 120)">
    <rect width="160" height="180" fill="url(#card-grad)" stroke="#f59e0b" stroke-width="2" rx="12" filter="url(#glow)" />
    <circle cx="80" cy="30" r="18" fill="#f59e0b" />
    <text x="80" y="35" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
    <text x="80" y="75" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Ticket Briefs</text>
    <text x="80" y="95" font-family="sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Markdown Ticket Queue</text>
    <rect x="15" y="115" width="130" height="45" fill="#0f172a" rx="6" />
    <text x="80" y="133" font-family="monospace" font-size="10" fill="#fbbf24" text-anchor="middle">50 Briefs Exported</text>
    <text x="80" y="148" font-family="sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Time: 0.460s</text>
  </g>

  <!-- Lower Summary Card -->
  <g transform="translate(80, 370)">
    <rect width="880" height="230" fill="#0f172a" stroke="#334155" stroke-width="1.5" rx="12" />
    <text x="30" y="35" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">Raw Execution Verification Metrics</text>
    
    <text x="30" y="75" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Total Execution Runtime: <tspan fill="#34d399" font-weight="bold">2.55 Seconds</tspan> (evaluated 30,000 portfolio items end-to-end)</text>
    <text x="30" y="105" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Data Source Connection: <tspan fill="#60a5fa" font-weight="bold">DuckDB SQL over data/raw/content_refresh_anonymized.csv</tspan></text>
    <text x="30" y="135" font-family="sans-serif" font-size="13" fill="#cbd5e1">• ML Decay Engine: <tspan fill="#a78bfa" font-weight="bold">Scikit-Learn Random Forest Classifier (100 trees, 0.74 ROC-AUC)</tspan></text>
    <text x="30" y="165" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Reason Code Distribution: <tspan fill="#f472b6" font-weight="bold">44 General Review, 5 Low CTR Visible Page, 1 Declining Demand</tspan></text>
    <text x="30" y="195" font-family="sans-serif" font-size="13" fill="#cbd5e1">• Deliverable Export: <tspan fill="#fbbf24" font-weight="bold">work/ai_fluency_build_core/outputs/refresh_scout_queue.md</tspan></text>
  </g>
</svg>
