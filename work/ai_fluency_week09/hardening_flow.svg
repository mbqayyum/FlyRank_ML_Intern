<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>

    <!-- Filter Shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <!-- Marker Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="560" rx="16" fill="url(#bgGrad)" />

  <!-- Outer Border -->
  <rect x="2" y="2" width="996" height="556" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />

  <!-- Header -->
  <g transform="translate(40, 35)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="url(#purpleGrad)" />
    <text x="16" y="22" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">🛡️</text>
    <text x="44" y="22" font-family="'Outfit', sans-serif" font-size="20" font-weight="bold" fill="#ffffff">Site Hardening &amp; Diligence Flow Architecture</text>
    <text x="44" y="38" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Adversarial Testing Vectors ➔ Hardening Interceptors ➔ Honest Triage (Fix-Nows vs. Known Limitations)</text>
  </g>

  <!-- Column 1: Adversarial Attack Vectors -->
  <g transform="translate(40, 95)">
    <rect width="280" height="420" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#1e293b" />
    <rect x="12" y="10" width="20" height="20" rx="4" fill="url(#redGrad)" />
    <text x="22" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
    <text x="40" y="25" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#f87171">1. Adversarial Test Vectors</text>

    <!-- Vector 1 -->
    <g transform="translate(15, 55)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Empty Form Submissions</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Triggering submit with 0 inputs / spaces</text>
    </g>

    <!-- Vector 2 -->
    <g transform="translate(15, 125)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Garbage &amp; XSS Injections</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Payloads: &lt;script&gt;, missing TLD, 12345!#</text>
    </g>

    <!-- Vector 3 -->
    <g transform="translate(15, 195)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Double-Click Rapid Fire</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">2-3 clicks within 150ms race window</text>
    </g>

    <!-- Vector 4 -->
    <g transform="translate(15, 265)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Network Timeout &amp; Hangs</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Simulated offline / stalled endpoint</text>
    </g>

    <!-- Vector 5 -->
    <g transform="translate(15, 335)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Automated Scraper Bots</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Blindly populating all form inputs</text>
    </g>
  </g>

  <!-- Connectors C1 -> C2 -->
  <line x1="320" y1="180" x2="360" y2="180" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="320" y1="320" x2="360" y2="320" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />
  <line x1="320" y1="450" x2="360" y2="450" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrowBlue)" />

  <!-- Column 2: Hardening Interceptors & Protections -->
  <g transform="translate(360, 95)">
    <rect width="280" height="420" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#1e293b" />
    <rect x="12" y="10" width="20" height="20" rx="4" fill="url(#blueGrad)" />
    <text x="22" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">⚙️</text>
    <text x="40" y="25" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#60a5fa">2. Hardening Interceptors</text>

    <!-- Interceptor 1 -->
    <g transform="translate(15, 55)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Strict RFC Regex &amp; Sanitizer</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Regex name/email + XSS DOM escaping</text>
    </g>

    <!-- Interceptor 2 -->
    <g transform="translate(15, 125)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">2000ms Debounce Submit Lock</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">isSubmitting flag + immediate UI lock</text>
    </g>

    <!-- Interceptor 3 -->
    <g transform="translate(15, 195)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">8-Second AbortController</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Prevents infinite spinner on server drop</text>
    </g>

    <!-- Interceptor 4 -->
    <g transform="translate(15, 265)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Hidden Honeypot Field (_gotcha)</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">Traps bots; silently drops spam</text>
    </g>

    <!-- Interceptor 5 -->
    <g transform="translate(15, 335)">
      <rect width="250" height="56" rx="8" fill="#0f172a" stroke="#1e3a8a" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#60a5fa">Live Char Counter &amp; ARIA Links</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#94a3b8">0/1000 counter + aria-invalid state</text>
    </g>
  </g>

  <!-- Connectors C2 -> C3 -->
  <line x1="640" y1="200" x2="680" y2="200" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <line x1="640" y1="400" x2="680" y2="400" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />

  <!-- Column 3: Triage & SEO Deliverables -->
  <g transform="translate(680, 95)">
    <rect width="280" height="420" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />
    <rect x="0" y="0" width="280" height="40" rx="12" fill="#1e293b" />
    <rect x="12" y="10" width="20" height="20" rx="4" fill="url(#emeraldGrad)" />
    <text x="22" y="24" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✓</text>
    <text x="40" y="25" font-family="'Outfit', sans-serif" font-size="14" font-weight="bold" fill="#34d399">3. Triage &amp; Findability</text>

    <!-- Triage Fix-Nows -->
    <g transform="translate(15, 55)">
      <rect width="250" height="100" rx="8" fill="#0f172a" stroke="#065f46" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#34d399">Fix-Nows Addressed (Live)</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• OpenGraph &amp; Twitter preview cards</text>
      <text x="12" y="56" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• JSON-LD Schema (Person/Work)</text>
      <text x="12" y="72" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• 8s timeout + double-submit lock</text>
      <text x="12" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• Honeypot + char counter wired</text>
    </g>

    <!-- Known Limitations -->
    <g transform="translate(15, 170)">
      <rect width="250" height="100" rx="8" fill="#0f172a" stroke="#92400e" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#fbbf24">Known Limitations (Named)</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• Free Formspree monthly quota (50/mo)</text>
      <text x="12" y="56" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• Static hosting (No SQL persistence)</text>
      <text x="12" y="72" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• Offline mode relies on client modal</text>
      <text x="12" y="88" font-family="'Inter', sans-serif" font-size="10" fill="#cbd5e1">• Subdomain awaits CNAME delegation</text>
    </g>

    <!-- Speed Telemetry -->
    <g transform="translate(15, 285)">
      <rect width="250" height="106" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-family="'Inter', sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Speed &amp; Weight Receipts</text>
      <text x="12" y="40" font-family="'Inter', sans-serif" font-size="10.5" fill="#a855f7">• Total Page Payload: <tspan font-weight="bold" fill="#ffffff">63.8 KB</tspan></text>
      <text x="12" y="58" font-family="'Inter', sans-serif" font-size="10.5" fill="#a855f7">• HTML / CSS / JS: <tspan font-weight="bold" fill="#ffffff">29 / 22 / 12 KB</tspan></text>
      <text x="12" y="76" font-family="'Inter', sans-serif" font-size="10.5" fill="#a855f7">• Time to Interactive: <tspan font-weight="bold" fill="#ffffff">&lt; 200 ms</tspan></text>
      <text x="12" y="94" font-family="'Inter', sans-serif" font-size="10.5" fill="#a855f7">• Framework Bloat: <tspan font-weight="bold" fill="#34d399">0.0 KB (Pure Web)</tspan></text>
    </g>
  </g>
</svg>
