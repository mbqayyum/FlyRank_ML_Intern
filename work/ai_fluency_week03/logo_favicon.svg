<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%" style="background:#0F172A; font-family: 'Outfit', sans-serif;">
  <defs>
    <!-- Accent Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Dark Surface Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="400" fill="#0F172A" />
  
  <!-- Subtle Grid Lines -->
  <path d="M 0,100 L 800,100 M 0,200 L 800,200 M 0,300 L 800,300" stroke="#1E293B" stroke-width="1" opacity="0.4" />
  <path d="M 200,0 L 200,400 M 400,0 L 400,400 M 600,0 L 600,400" stroke="#1E293B" stroke-width="1" opacity="0.4" />

  <!-- SECTION 1: PRIMARY LOGO MARK (Left Side) -->
  <g transform="translate(60, 80)">
    <!-- Monogram Card Container -->
    <rect x="0" y="0" width="240" height="240" rx="32" fill="url(#cardGrad)" stroke="#334155" stroke-width="2" filter="url(#dropShadow)" />
    
    <!-- Outer Search Intelligence Ring (Rank/Signal Wave) -->
    <circle cx="120" cy="120" r="75" fill="none" stroke="#1E293B" stroke-width="8" />
    <path d="M 120,45 A 75,75 0 0,1 195,120" fill="none" stroke="url(#tealGrad)" stroke-width="8" stroke-linecap="round" />
    
    <!-- Monogram MQ Mark -->
    <!-- M Symbol -->
    <path d="M 75,150 L 75,90 L 95,125 L 115,90 L 115,150" fill="none" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Q Symbol / Precision Signal Node -->
    <path d="M 135,110 A 25,25 0 1,1 135,145 A 25,25 0 0,1 135,110 Z" fill="none" stroke="#F8FAFC" stroke-width="7" />
    <path d="M 152,138 L 168,154" fill="none" stroke="url(#tealGrad)" stroke-width="7" stroke-linecap="round" />

    <!-- Pulse Signal Dots -->
    <circle cx="195" cy="120" r="6" fill="#38BDF8" />
    <circle cx="120" cy="45" r="5" fill="#0284C7" />
  </g>

  <!-- SECTION 2: LOGO WORDMARK & TYPOGRAPHY (Middle) -->
  <g transform="translate(330, 140)">
    <!-- Brand Name -->
    <text x="0" y="40" font-size="44" font-weight="700" fill="#F8FAFC" letter-spacing="-1">M. B. QAYYUM</text>
    <!-- Subtitle / Track Role -->
    <text x="0" y="75" font-size="18" font-weight="500" fill="#0EA5E9" letter-spacing="2">SEARCH INTELLIGENCE ARCHITECT</text>
    <text x="0" y="105" font-size="14" font-weight="400" fill="#94A3B8" letter-spacing="0.5">Machine Learning · Panel Data · Leakage Control</text>

    <!-- Divider Line -->
    <line x1="0" y1="125" x2="400" y2="125" stroke="#334155" stroke-width="1.5" />

    <!-- Palette Swatches -->
    <g transform="translate(0, 145)">
      <!-- Swatch 1: Near White -->
      <rect x="0" y="0" width="28" height="28" rx="6" fill="#F8FAFC" stroke="#475569" stroke-width="1" />
      <text x="36" y="19" font-size="12" font-weight="600" fill="#94A3B8">#F8FAFC</text>

      <!-- Swatch 2: Near Black -->
      <rect x="110" y="0" width="28" height="28" rx="6" fill="#0F172A" stroke="#475569" stroke-width="1" />
      <text x="146" y="19" font-size="12" font-weight="600" fill="#94A3B8">#0F172A</text>

      <!-- Swatch 3: Surface -->
      <rect x="220" y="0" width="28" height="28" rx="6" fill="#1E293B" stroke="#475569" stroke-width="1" />
      <text x="256" y="19" font-size="12" font-weight="600" fill="#94A3B8">#1E293B</text>

      <!-- Swatch 4: Accent -->
      <rect x="330" y="0" width="28" height="28" rx="6" fill="#0EA5E9" />
      <text x="366" y="19" font-size="12" font-weight="600" fill="#38BDF8">#0EA5E9</text>
    </g>
  </g>

  <!-- FAVICON BADGE INSET (Top Right Corner) -->
  <g transform="translate(710, 30)">
    <rect x="0" y="0" width="60" height="60" rx="16" fill="url(#cardGrad)" stroke="#0EA5E9" stroke-width="2" />
    <path d="M 18,38 L 18,22 L 24,31 L 30,22 L 30,38" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="42" cy="30" r="8" fill="none" stroke="#F8FAFC" stroke-width="3" />
    <path d="M 47,35 L 52,40" fill="none" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
    <text x="30" y="74" font-size="10" font-weight="600" fill="#94A3B8" text-anchor="middle">FAVICON (32x32)</text>
  </g>
</svg>
