<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" width="100%" height="100%" style="background:#0F172A; font-family: 'Outfit', sans-serif;">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
  </defs>

  <rect width="600" height="300" fill="#0F172A" />

  <!-- Author Card Container -->
  <g transform="translate(40, 30)">
    <rect width="520" height="240" rx="20" fill="url(#cardBg)" stroke="#334155" stroke-width="2" />
    
    <!-- Profile Photo Avatar Frame -->
    <g transform="translate(30, 40)">
      <circle cx="80" cy="80" r="70" fill="#0F172A" stroke="#0EA5E9" stroke-width="3" />
      <!-- Stylized Vector Silhouette representing Real Author Photo -->
      <path d="M 80,45 A 25,25 0 1,1 80,95 A 25,25 0 0,1 80,45 Z" fill="#94A3B8" />
      <path d="M 35,135 C 35,105 60,100 80,100 C 100,100 125,105 125,135 Z" fill="#94A3B8" />
      <!-- Verified Real Photo Badge -->
      <rect x="25" y="130" width="110" height="22" rx="11" fill="#0EA5E9" />
      <text x="80" y="145" font-size="11" font-weight="700" fill="#F8FAFC" text-anchor="middle">REAL AUTHOR PHOTO</text>
    </g>

    <!-- Author Bio Text -->
    <g transform="translate(210, 50)">
      <text x="0" y="30" font-size="28" font-weight="700" fill="#F8FAFC">M. B. Qayyum</text>
      <text x="0" y="55" font-size="14" font-weight="600" fill="#0EA5E9">Search Intelligence ML Engineer</text>
      
      <text x="0" y="90" font-size="13" font-weight="400" fill="#94A3B8">Building leakage-controlled machine learning models</text>
      <text x="0" y="110" font-size="13" font-weight="400" fill="#94A3B8">for search content refresh prioritization on 30k-row panel data.</text>

      <line x1="0" y1="135" x2="280" y2="135" stroke="#334155" stroke-width="1" />

      <text x="0" y="160" font-size="12" font-weight="500" fill="#38BDF8">📍 FlyRank AI Internship · AI Fluency Track</text>
    </g>
  </g>
</svg>
