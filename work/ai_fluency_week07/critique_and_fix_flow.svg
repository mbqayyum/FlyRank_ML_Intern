<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="critGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="fixGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="920" height="540" rx="16" fill="url(#bgGrad7)"/>
  <rect width="920" height="540" rx="16" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="16" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="middle">CHECKPOINT 1 GATE</text>
    <text x="0" y="52" fill="#f8fafc" font-family="'Outfit', sans-serif" font-size="22" font-weight="700">Week 7 Design Review: Critique &amp; Live Fix Pipeline</text>
    <text x="0" y="74" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="13">Surviving the 10-second proof test, sorting must-fixes without defending, and executing live site updates</text>
  </g>

  <!-- Left Column: The 10-Second Test & Unfiltered Feedback -->
  <g transform="translate(40, 135)">
    <!-- Box 1: Critique Questions -->
    <rect x="0" y="0" width="405" height="165" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="4" height="165" rx="2" fill="url(#critGrad)"/>
    
    <text x="20" y="26" fill="#fb7185" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">1. Reviewer 10-Second Test (Unfiltered)</text>
    
    <text x="20" y="52" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Q1: "In 10 seconds, what do I do?"</text>
    <text x="20" y="70" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">Feedback: <tspan fill="#fca5a5">"Generic AI/ML engineer. It didn't shout Search Content Refresh."</tspan></text>
    
    <text x="20" y="100" fill="#e2e8f0" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Q2: "Would you believe I'm good at it?"</text>
    <text x="20" y="118" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">Feedback: <tspan fill="#fca5a5">"Cards looked pretty, but the 3.1x precision metric was buried."</tspan></text>
    
    <text x="20" y="146" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10.5">Mindset: Zero defensive arguments → Treat as high-value telemetry.</text>

    <!-- Box 2: Must-Fix vs Nice-To-Have Sorting -->
    <g transform="translate(0, 180)">
      <rect x="0" y="0" width="405" height="165" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow7)"/>
      <rect x="0" y="0" width="4" height="165" rx="2" fill="url(#blueGrad)"/>
      
      <text x="20" y="26" fill="#60a5fa" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">2. Honest Feedback Triage Matrix</text>
      
      <g transform="translate(20, 42)">
        <rect x="0" y="0" width="75" height="18" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
        <text x="37" y="13" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MUST-FIX</text>
        <text x="85" y="13" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5">Hero CTAs pointed away from the paper &amp; booking.</text>
      </g>

      <g transform="translate(20, 68)">
        <rect x="0" y="0" width="75" height="18" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
        <text x="37" y="13" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MUST-FIX</text>
        <text x="85" y="13" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5">Projects grid overflowed horizontally on 360px phones.</text>
      </g>

      <g transform="translate(20, 94)">
        <rect x="0" y="0" width="75" height="18" rx="4" fill="#f43f5e" fill-opacity="0.2"/>
        <text x="37" y="13" fill="#fb7185" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">MUST-FIX</text>
        <text x="85" y="13" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11.5">Booking copy said 30-min instead of 15-min discovery.</text>
      </g>

      <g transform="translate(20, 120)">
        <rect x="0" y="0" width="75" height="18" rx="4" fill="#3b82f6" fill-opacity="0.2"/>
        <text x="37" y="13" fill="#93c5fd" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" text-anchor="middle">NICE-HAVE</text>
        <text x="85" y="13" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11.5">Interactive live DuckDB query runner (saved for W8).</text>
      </g>
    </g>
  </g>

  <!-- Right Column: Live Executed Fixes on docs/ -->
  <g transform="translate(475, 135)">
    <rect x="0" y="0" width="405" height="345" rx="12" fill="#111827" stroke="#1e293b" stroke-width="1.5" filter="url(#shadow7)"/>
    <rect x="0" y="0" width="4" height="345" rx="2" fill="url(#fixGrad)"/>
    
    <text x="20" y="26" fill="#34d399" font-family="'Outfit', sans-serif" font-size="14" font-weight="700">3. Live Site Fixes Executed (docs/index.html &amp; docs/style.css)</text>
    
    <!-- Fix 1 -->
    <g transform="translate(20, 46)">
      <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Hero Headline &amp; Subtitle Aligned to Proof Statement</text>
      <text x="30" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Directly states Search Content Refresh Prioritization &amp; 3.1x Lift.</text>
    </g>

    <!-- Fix 2 -->
    <g transform="translate(20, 96)">
      <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Hero Actions Channel to the ONE ACTION</text>
      <text x="30" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Primary: "Read Capstone Paper" | Secondary: "Book 15-Min Discovery Call".</text>
    </g>

    <!-- Fix 3 -->
    <g transform="translate(20, 146)">
      <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Receipts Front &amp; Center in System Context Card</text>
      <text x="30" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Added Model Lift (3.1x Precision@50) &amp; Leakage Audit (Passed).</text>
    </g>

    <!-- Fix 4 -->
    <g transform="translate(20, 196)">
      <circle cx="10" cy="10" r="10" fill="#10b981" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#34d399" font-family="'Inter', sans-serif" font-size="11" font-weight="700" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Mobile Grid Responsive Constraint Fixed</text>
      <text x="30" y="32" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Changed minmax(340px) to minmax(min(100%, 320px)) + 48px tap targets.</text>
    </g>

    <!-- Verdict Box -->
    <g transform="translate(20, 252)">
      <rect x="0" y="0" width="365" height="70" rx="8" fill="#0b0f19" stroke="#10b981" stroke-width="1.2"/>
      <text x="16" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CHECKPOINT 1 VERDICT: ✅ 100% PASS</text>
      <text x="16" y="44" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="11">All must-fixes deployed live to GitHub Pages /docs. Ready for Week 8.</text>
    </g>
  </g>

  <!-- Footer Bar -->
  <g transform="translate(40, 505)">
    <text x="0" y="12" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="11">FlyRank AI Internship · Week 7 · Checkpoint 1 Design Review · M. B. Qayyum</text>
    <text x="840" y="12" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">LIVE SITE SYNCHRONIZED</text>
  </g>
</svg>
